[project]
name = "primerdriver"
version = "1.7.0"
description = "Automated design of mutagenic PCR primers"
authors = [
    { name = "Kenneth V. Domingo", email = "hello@kvd.studio" },
    { name = "Numeriano Amer E. Gutierrez", email = "ngutierrez@evc.pshs.edu.ph" },
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "python-dotenv~=1.0",
    "Flask~=2.0",
    "gunicorn[gthread]~=26.0",
    "loguru~=0.0",
    "Flask-Caching~=1.0",
    "biopython~=1.78",
    "pandas~=3.0",
    "numpy~=2.0",
    "tabulate~=0.8.0",
    "furo~=2025.0",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "requests~=2.0",
]

[project.urls]
Homepage = "https://primerdriver.kvd.studio"
Repository = "https://github.com/kvdomingo/primerdriver"
Documentation = "https://primerdriver-docs.kvd.studio"

[dependency-groups]
dev = [
    "ruff~=0.0",
    "pyinstaller~=6.0",
    "coverage-badge~=1.0",
    "pytest~=7.0",
    "mkdocs~=1.0",
    "mkdocs-material~=9.0",
    "mkdocstrings[python]~=1.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E203", "E266", "E501", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Params",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "pydantic.validator",
    "pydantic.field_validator",
    "pydantic.model_validator",
]

[tool.rumdl]
disable = ["MD033"]

[tool.rumdl.MD013]
reflow = true

[tool.rumdl.MD077]
indent = 4
