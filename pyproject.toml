[project]
name = "primerdriver"
version = "1.6.0"
description = "Automated design of mutagenic PCR primers"
authors = [
    { name = "Kenneth V. Domingo", email = "hello@kvd.studio" },
    { name = "Numeriano Amer E. Gutierrez", email = "ngutierrez@evc.pshs.edu.ph" },
]
requires-python = ">=3.9,<3.11"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "Flask>=2.1.2,<3",
    "gunicorn[gthread]>=20.1.0,<21",
    "loguru>=0.6.0,<0.7",
    "Flask-Caching>=1.10.1,<2",
    "biopython==1.76",
    "pandas==1.4.2",
    "numpy==1.24.4",
    "tabulate>=0.8.9,<0.9",
    "furo>=2023.3.27,<2024",
    "pydantic<2.0.0",
    "requests>=2.27.1,<3",
]

[project.urls]
Homepage = "https://primerdriver.kvd.studio"
Repository = "https://github.com/kvdomingo/primerdriver"
Documentation = "https://primerdriver-docs.kvd.studio"

[dependency-groups]
dev = [
    "ruff>=0.7.1,<0.8",
    "pyinstaller>=6.11.0,<7",
    "coverage-badge>=1.1.0,<2",
    "pytest>=7.2.2,<8",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.43,<10",
    "mkdocstrings[python]>=0.26.2,<0.27",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E203", "E266", "E501", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.validator"]

[tool.rumdl]
disable = ["MD033"]

[tool.rumdl.MD013]
reflow = true

[tool.rumdl.MD077]
indent = 4
