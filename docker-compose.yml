name: primerdriver

volumes:
  venv-data:
  docs-venv-data:

services:
  backend:
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: kvdomingo/primerdriver-api:latest
    command:
      - |
        uv sync --dev --all-groups --all-packages
        exec uv run fastapi dev primerx/app.py --host 0.0.0.0 --port 5000
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/primerdriver
      - venv-data:/primerdriver/.venv
    ports:
      - "5000:5000"
    develop:
      watch:
        - path: uv.lock
          action: restart

  docs:
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: kvdomingo/primerdriver-api:latest
    restart: unless-stopped
    env_file: .env
    command:
      - |
        uv sync --dev --all-groups --all-packages
        exec uv run mkdocs serve -a 0.0.0.0:8000
    volumes:
      - .:/primerdriver
      - docs-venv-data:/primerdriver/.venv
    ports:
      - "8000:8000"
    develop:
      watch:
        - path: uv.lock
          action: restart

  frontend:
    image: oven/bun:1.4-alpine
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
    entrypoint:
      - /bin/sh
      - "-c"
    command:
      - |
        bun install
        exec bun run dev
    working_dir: /web
    volumes:
      - ./ui:/web
    ports:
      - "3000:3000"
    develop:
      watch:
        - path: bun.lockb
          action: restart
