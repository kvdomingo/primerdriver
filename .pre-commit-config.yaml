repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: bash -c 'cd ui && node_modules/.bin/biome check --write --unsafe --files-ignore-unknown=true --no-errors-on-unmatched "${@#ui/}"' --
        language: system
        files: ^ui/
        types_or: [javascript, jsx, ts, tsx, json, jsonc, css, graphql]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: '^sample\.fasta$'
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: templates/.+\.ya?ml$
      - id: check-json
      - id: check-toml
      - id: check-xml
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: ["--verbose", "--config", ".gitleaks.toml"]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args:
          - --ignore
          - DL3008
          - --ignore
          - DL3018
